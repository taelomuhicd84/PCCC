# Cấu hình chung. Khoá API đặt trong .env (KHÔNG commit).
gemini:
  backend: web                # api (GEMINI_API_KEY) | web (gemini.google.com qua Chrome, đăng nhập: gemini-login)
  web:
    model: Pro                # tên model trong menu Gemini web: Pro (3.1 Pro, đọc bản vẽ tốt nhất) | Flash | Flash-Lite
    fallback_models: [Flash]  # khi Pro hết lượt trong ngày
    upload: pdf               # LUÔN pdf — người dùng cấm gửi hình cho Gemini (png chỉ còn trong code cũ, không dùng)
    chunk_pages: 8            # > số trang này -> chia chunk, mỗi chunk 1 tab (cuộc trò chuyện riêng); 72 trang = 9 tab ~3 phút
    tabs: 10                  # số tab song song khi chia chunk — TỐI ĐA 10 (code khoá), mở giãn cách 8–20 s chống bị coi là bot
    thinking: Trung bình      # mức suy luận của Pro (Thấp | Trung bình | Cao | Deep Think) — người dùng chọn Trung bình 13/10/2026
    profile: data/chrome_gemini   # chỉ dùng khi .env KHÔNG có cookie (gemini-login đăng nhập tay); có cookie -> trình duyệt sạch
    # cookie đăng nhập: dòng GEMINI_COOKIES=<json Cookie-Editor> trong .env (không đặt ở đây)
    headless: true            # chạy Chrome ẩn nền (người dùng yêu cầu); Google chặn thì đổi false
    timeout_s: 300            # chờ tối đa mỗi câu trả lời
  model: gemini-2.5-flash     # đổi sang gemini-2.5-pro nếu bản vẽ phức tạp
  dpi: 150                    # độ phân giải render ảnh gửi Gemini
  max_tile_px: 3000           # cạnh dài tối đa của mỗi ảnh tile
  temperature: 0.1
  thinking_budget: 1024        # giới hạn 'suy nghĩ' của Gemini 2.5 (đọc bản vẽ là nhận dạng) -> nhanh, rẻ; null = mặc định
  workers: 4                   # số trang gửi Gemini song song (giảm nếu bị 429 quota)
  retries: 4                  # số lần thử lại mỗi model (chờ 5,10,20,40 s) khi Gemini quá tải 503/429
  fallback_models:            # model dự phòng khi model chính lỗi liên tục
    - gemini-3.5-flash-lite
rules:
  packs:                      # các rule pack trong thư mục rules/ (thêm TCVN khác sau này)
    - qcvn06_2022_sd01_2023.yaml
annotate:
  min_severity: info          # error | warning | info

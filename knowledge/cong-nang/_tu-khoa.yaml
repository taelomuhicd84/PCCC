# Bảng "train" phán đoán công năng: TÊN khu vực/phòng/hạng mục -> loại + nhóm F. Người dùng sửa/thêm dòng ở đây (không phải sửa code).
# Khớp không phân biệt dấu/hoa thường; DÒNG ĐẦU TIÊN khớp thì thắng (đặt dòng cụ thể lên trước dòng chung).
# loai:
#   cong-nang   khu có công năng thật -> tính vào tỷ lệ 70% (nhom bắt buộc, theo Bảng 6 knowled `bang-6-phan-nhom-nha`)
#   loai-tru    KHÔNG tính vào tổng (QCVN 06 1.4.41 CHÚ THÍCH: hệ thống kỹ thuật, PCCC, gian lánh nạn, đỗ xe) — ghi `ly` = kỹ thuật|pccc|lanh-nan|do-xe
#   chung       diện tích dùng chung / đi lại (hành lang, thang, WC…): không gán công năng riêng, bỏ khỏi cả tử và mẫu (GIẢ ĐỊNH, chờ duyệt)
#   phu-tro     phục vụ công năng chính của cùng hạng mục (bếp nhà hàng…): cộng vào công năng chính (GIẢ ĐỊNH, chờ duyệt); kết luận được thử
#               cả hai cách (có / không cộng) — lệch nhau thì báo "nhạy" để người xem.
#   theo-chinh  sảnh đón/tiếp tân của chính công năng chính (người dùng chốt 15/10/2026: sảnh trống vẫn là công năng sảnh đón của nhà): LUÔN cộng vào công năng chính
# nguon: căn cứ (Bảng 6 hay ghi chú). "suy từ…" = chưa có chữ trực tiếp trong Bảng 6 -> cần duyệt.
- id: LT-LANH-NAN
  khop: 'lánh nạn'
  loai: loai-tru
  ly: lanh-nan
  nguon: QCVN 06 1.4.41 chú thích
- id: LT-PCCC
  khop: 'phòng bơm|trạm bơm|bể nước|phòng pccc|điều khiển chống cháy|phòng trực chống cháy|chữa cháy'
  loai: loai-tru
  ly: pccc
  nguon: QCVN 06 1.4.41 chú thích
- id: LT-KY-THUAT
  khop: 'kỹ thuật|máy phát|trạm điện|biến áp|phòng điện|phòng máy|tủ điện|điều hòa|xử lý nước thải|bể phốt|máy nén'
  loai: loai-tru
  ly: kỹ thuật
  nguon: QCVN 06 1.4.41 chú thích (hệ thống kỹ thuật)
- id: LT-DO-XE
  khop: 'đỗ xe|để xe|bãi xe|hầm xe|gara|ga ra|nhà xe'
  loai: loai-tru
  ly: do-xe
  nguon: QCVN 06 1.4.41 chú thích (đỗ xe); nếu CẢ hạng mục chỉ là nhà/gara đỗ xe thì công năng là F5.2 (Bảng 6)
- id: CH-DI-LAI
  khop: 'hành lang|cầu thang|thang bộ|thang máy|giếng thang|sảnh thang|lối đi chung|nhà vệ sinh|vệ sinh|\bwc\b|toilet'
  loai: chung
  nguon: không có chữ trong QCVN; giả định (chờ duyệt)
- id: PT-BEP
  khop: 'nhà bếp|khu bếp|bếp|chế biến|phòng để đồ|để đồ|phòng kho|\bkho\b|quầy bar|phục vụ ăn uống|phục vụ'
  loai: phu-tro
  nguon: giả định phục vụ công năng chính của hạng mục (chờ duyệt)
- id: TC-SANH-DON
  khop: 'sảnh đón|sảnh tiếp tân|sảnh lễ tân|sảnh chính|sảnh tầng|sảnh trống|không bố trí công năng'
  loai: theo-chinh
  nguon: người dùng chốt 15/10/2026 (ca 72 Nguyễn Khoái) — sảnh ghi "không bố trí công năng" vẫn là sảnh đón phục vụ công năng chính (home stay)

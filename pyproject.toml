[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pccc-checker"
version = "0.1.0"
description = "Kiểm tra bản vẽ PDF PCCC theo QCVN 06:2022/BXD & Sửa đổi 1:2023"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "google-genai>=1.0", "ezdxf>=1.3", "pyyaml>=6.0"]

[project.scripts]
pccc = "pccc_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
